[package]
name = "ryoiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
futures-util = "0.3"
relm4 = { version = "0.11.0", features = ["libadwaita"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.49", features = ["rt"] }
thiserror = "2.0"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.23"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
